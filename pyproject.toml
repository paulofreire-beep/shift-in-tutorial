[project]
name = "snip"
version = "0.1.0"
description = "A tiny URL shortener — workshop starter application."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]

# robotframework (system tests) is intentionally NOT listed here yet.
# Adding it is part of the workshop (M4).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snip"]
